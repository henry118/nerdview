name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dco:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: DCO check
        run: |
          base=${{ github.event.pull_request.base.sha }}
          for sha in $(git rev-list --no-merges "$base"..HEAD); do
            if ! git log -1 --format='%B' "$sha" | grep -q "^Signed-off-by: "; then
              echo "Commit $sha is missing Signed-off-by"
              exit 1
            fi
          done
          echo "All commits have Signed-off-by"

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.25', '1.26']
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}

      - name: Go fix
        run: |
          go fix ./...
          if [ -n "$(git status --porcelain)" ]; then
            echo "go fix produced changes:"
            git diff
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - name: Test
        run: go test ./...
